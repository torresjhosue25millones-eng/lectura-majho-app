[phases.install]
cmds = [
  "npm --prefix backend ci",
  "npm --prefix frontend ci"
]

[phases.build]
cmds = [
  "cd backend && node node_modules/typescript/bin/tsc",
  "cd frontend && node node_modules/vite/bin/vite.js build",
  "cp -r frontend/dist public"
]

[start]
cmd = "node backend/dist/index.js"
