[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "nss", "atk", "cups", "dbus", "expat", "libdrm", "mesa", "pango", "xorg.libX11", "xorg.libXext", "xorg.libXfixes", "xorg.libXi", "xorg.libXrender", "xorg.libXtst", "xorg.libxcb"]

[phases.build]
cmds = [
  "npm install --prefix backend --include=dev",
  "npm install --prefix frontend --include=dev",
  "npm run build --prefix backend",
  "npm run build --prefix frontend",
  "cp -r frontend/dist public",
  "cd backend && npx playwright install --with-deps chromium"
]

[start]
cmd = "node backend/dist/index.js"
